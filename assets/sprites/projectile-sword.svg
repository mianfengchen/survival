<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- 刀身必须朝 +x 绘制：drawProjectiles 用 atan2(vy, vx) 旋转精灵，
       所以沿 -y 绘制的图会与自身飞行方向垂直，表现为"横着飞"。
       原图刀尖朝上，这里整体顺时针旋转 90° 改为朝右。
       （同样的问题此前在 auroraNeedle 上出现过，见 pixi-renderer.js 的注释。） -->
  <g transform="rotate(90 64 64)" stroke="#495548" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M64 16l18 42-18 40-18-40z" fill="#ffffff"/>
    <path d="M64 22v58" fill="none"/>
    <rect x="42" y="76" width="44" height="10" rx="5" fill="#fff0c8"/>
    <rect x="58" y="84" width="12" height="22" rx="5" fill="#ffffff"/>
  </g>
</svg>
